name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # امکان اجرای دستی ورک‌فلو با یک کلیک از تب Actions

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Prepare Environment & Keystore
        run: |
          # ۱. اطمینان از وجود فایل .env برای پلاگین Secrets
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

          # ۲. بازگردانی کلید دیباگ از base64 در صورت وجود فایل
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # ۳. در صورتی که فایل کلید در گیت وجود نداشت، کلید استاندارد دیباگ با keytool ساخته می‌شود
          if [ ! -s debug.keystore ]; then
            echo "debug.keystore not found. Generating a valid debug keystore with keytool..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          # بررسی وضعیت نهایی فایل کلید
          echo "debug.keystore verification:"
          ls -lh debug.keystore

          # ۴. دسترسی اجرایی به اسکریپت gradlew
          chmod +x gradlew

      - name: 5. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Find & Rename APK for Easy Download
        run: |
          mkdir -p output_apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apk/SD_Storage_Manager_J1.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/SD_Storage_Manager_J1.apk \;
          fi
          echo "APK successfully generated and copied to output_apk directory:"
          ls -lh output_apk/

      - name: 7. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Storage-Manager-Galaxy-J1-APK
          path: output_apk/SD_Storage_Manager_J1.apk
          retention-days: 14
