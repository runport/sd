name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # امکان اجرای دستی ورک‌فلو با یک کلیک از تب Actions

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Prepare Environment & Keystore
        run: |
          # اطمینان از وجود فایل .env برای پلاگین Secrets
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

          # دیکود کردن فایل کلید debug در صورت وجود
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # دسترسی اجرایی به gradlew
          chmod +x gradlew

      - name: 5. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Find & Rename APK for Easy Download
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/SD_Storage_Manager_J1.apk \;
          echo "APK successfully generated and copied to output_apk directory."
          ls -lh output_apk/

      - name: 7. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Storage-Manager-Galaxy-J1-APK
          path: output_apk/SD_Storage_Manager_J1.apk
          retention-days: 14
