name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Prepare Environment & Keystore
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

          # Decode base64 debug keystore if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # Auto-generate standard debug keystore if missing
          if [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          ls -lh debug.keystore
          chmod +x gradlew

      - name: 5. Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 6. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 7. Verify APK and Prepare Download
        run: |
          mkdir -p output_apk
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK $APK_FILE was not found!"
            find app/build/outputs/ -type f || true
            exit 1
          fi

          cp "$APK_FILE" output_apk/SD_Storage_Manager_J1.apk
          echo "=== APK Output Verification ==="
          ls -lh output_apk/SD_Storage_Manager_J1.apk

      - name: 8. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Storage-Manager-Galaxy-J1-APK
          path: output_apk/SD_Storage_Manager_J1.apk
          retention-days: 14
